<h1 class="text-3xl font-bold font-montserrat mt-5">
  Todos los productos
  <span class="text-accent">{{ gender() }}</span>
</h1>

<div class="flex justify-between">
  <h2 class="text-xl mb-5">Para todos los gustos</h2>
  <span class="flex"><h2>Nro de Productos: &nbsp;</h2> {{ productsResource.value()?.count }}</span>
</div>
<!-- <h2 class="text-xl mb-5">Para todos los gustos</h2> -->

@if( productsResource.isLoading()) {
  <app-is-loading></app-is-loading>
}

@if (productsResource.hasValue()) {
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3"
  >
    @for (product of productsResource.value()?.products; track $index) {
      <product-card [product]="product" />
  
    }
    <!-- Empty -->
    @empty {
      <p>No hay productos</p>
    }
  </div>
  
  <app-pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />


}
